<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival:tbc Logo</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0c16;
            --primary-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --text-primary: #f3f4f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* App Page Background Mesh */
        .glass-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.1) 0%, transparent 45%),
                        linear-gradient(180deg, #070913 0%, #0c0f24 100%);
            background-size: cover;
        }

        /* Centered on the page */
        .brand-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-icon {
            font-size: 48px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand h1 {
            font-weight: 800;
            font-size: 44px;
            letter-spacing: -1px;
        }

        .brand h1 span {
            font-weight: 300;
            color: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="glass-bg"></div>
    <div class="brand-container">
        <div class="brand">
            <i class="fa-solid fa-film logo-icon"></i>
            <h1>Festival<span>tbc</span></h1>
        </div>
    </div>
</body>
</html>
